<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogrant Payroll</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Стилі, що базуються на перевіреній версії, яка відображається супер */
        body { font-family: -apple-system, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: 1px solid #ddd; cursor: pointer; border-radius: 8px; }
        .tab-btn.active { background: #0d6efd; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .input-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-top: 5px; }
        
        .result { margin-top: 20px; padding: 15px; border-left: 4px solid #198754; background: #f8f9fa; display: none; }
        .highlight { font-weight: bold; color: #dc3545; }
        
        #imgBtn { background: #198754; color: white; padding: 10px; width: 100%; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(this, 'tab1')">Реверсивний</button>
        <button class="tab-btn" onclick="switchTab(this, 'tab2')">Ставка+Премія</button>
    </div>

    <div id="tab1" class="tab-content active">
        <label><input type="checkbox" id="isDisability1" onchange="calculateTab1()"> Інвалідність (8.41% ЄСВ)</label>
        <div class="input-group">
            <label>Net (на руки):</label>
            <input type="number" id="inNet" oninput="calculateTab1('net')">
        </div>
        <div class="input-group">
            <label>Gross (нарах.):</label>
            <input type="number" id="inGross" oninput="calculateTab1('gross')">
        </div>
        <div class="input-group">
            <label>Total (бюджет):</label>
            <input type="number" id="inTotal" oninput="calculateTab1('total')">
        </div>
        <div id="res1" class="result"></div>
    </div>

    <div id="tab2" class="tab-content">
        <label><input type="checkbox" id="isDisability2" onchange="calculateTab2()"> Інвалідність (8.41% ЄСВ)</label>
        <div class="input-group">
            <label>Ставка:</label>
            <input type="number" id="baseSalary" oninput="calculateTab2()">
            <select id="baseType" onchange="calculateTab2()">
                <option value="net">Net</option>
                <option value="gross">Gross</option>
            </select>
        </div>
        <div class="input-group">
            <label>Премія (%):</label>
            <input type="number" id="bonusPercent" oninput="calculateTab2()">
        </div>
        <div id="res2" class="result"></div>
    </div>

    <button id="imgBtn" style="display:none;" onclick="saveAsImage()">📸 Зберегти Оффер (PNG)</button>
</div>

<script>
    const FIXED_FOP_ESV = 1760;

    function switchTab(btn, id) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function calculateTab1(source) {
        const isDis = document.getElementById('isDisability1').checked;
        let esvRate = isDis ? 0.0841 : 0.22;
        let base = parseFloat(document.getElementById(source === 'net' ? 'inNet' : (source === 'gross' ? 'inGross' : 'inTotal')).value) || 0;
        
        let net, gross, total;
        if (source === 'net') { net = base; gross = net / 0.77; total = gross * (1 + esvRate); }
        else if (source === 'gross') { gross = base; net = gross * 0.77; total = gross * (1 + esvRate); }
        else { total = base; gross = total / (1 + esvRate); net = gross * 0.77; }

        document.getElementById('inNet').value = net.toFixed(2);
        document.getElementById('inGross').value = gross.toFixed(2);
        document.getElementById('inTotal').value = total.toFixed(2);
        
        document.getElementById('res1').innerHTML = `Нараховано: ${gross.toFixed(2)}<br>Податки: ${(gross*0.23).toFixed(2)}`;
        document.getElementById('res1').style.display = 'block';
        document.getElementById('imgBtn').style.display = 'block';
    }

    function calculateTab2() {
        const isDis = document.getElementById('isDisability2').checked;
        let esvRate = isDis ? 0.0841 : 0.22;
        let base = parseFloat(document.getElementById('baseSalary').value) || 0;
        let bonus = parseFloat(document.getElementById('bonusPercent').value) || 0;
        let baseGross = document.getElementById('baseType').value === 'net' ? base / 0.77 : base;
        
        let totalGross = baseGross * (1 + bonus/100);
        let totalNet = totalGross * 0.77;
        let totalCost = totalGross * (1 + esvRate);

        document.getElementById('res2').innerHTML = `Gross: ${totalGross.toFixed(2)}<br>Net: ${totalNet.toFixed(2)}<br>Total: ${totalCost.toFixed(2)}`;
        document.getElementById('res2').style.display = 'block';
        document.getElementById('imgBtn').style.display = 'block';
    }

    function saveAsImage() {
        html2canvas(document.getElementById('mainContainer')).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Offer.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }
</script>
</body>
</html>
