<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Зарплатний калькулятор</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #f4f7f6; 
            color: #333; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }
        /* Обгортка, яка буде перетворюватися на картинку */
        #captureArea {
            background-color: #f4f7f6; /* Важливо для збереження фону на картинці */
            padding: 10px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        
        .calculator-container { 
            background: white; 
            padding: 25px 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            width: 100%; 
            box-sizing: border-box; 
        }
        
        h2 { margin-top: 0; font-size: 24px; color: #111; border-bottom: 2px solid #0d6efd; padding-bottom: 12px; }
        
        label.main-label { font-weight: 600; font-size: 16px; display: block; margin-top: 20px; margin-bottom: 10px; }
        
        input[type="number"] { 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 25px; 
            border: 2px solid #cdd3d8; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 18px; 
            font-weight: 500;
            transition: border-color 0.2s; 
            -webkit-appearance: none; 
        }
        input[type="number"]:focus { border-color: #0d6efd; outline: none; }
        
        .checkbox-group { display: flex; align-items: flex-start; margin-bottom: 30px; background: #f8fbff; padding: 18px; border-radius: 8px; border: 1px solid #d8e6f5; }
        .checkbox-group input { margin-right: 15px; margin-top: 2px; width: 24px; height: 24px; cursor: pointer; flex-shrink: 0; }
        .checkbox-group label { font-weight: normal; margin-bottom: 0; cursor: pointer; line-height: 1.4; font-size: 16px; }
        .checkbox-group small { color: #555; font-size: 13px; display: block; margin-top: 6px; }
        
        button { width: 100%; padding: 18px; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: 600; margin-bottom: 15px; -webkit-tap-highlight-color: transparent; }
        .btn-primary { background-color: #0d6efd; }
        .btn-primary:active { background-color: #0b5ed7; transform: scale(0.98); }
        .btn-success { background-color: #198754; display: none; }
        .btn-success:active { background-color: #157347; transform: scale(0.98); }
        
        .result { margin-top: 25px; padding: 20px; background-color: #f8f9fa; border-left: 5px solid #198754; border-radius: 0 8px 8px 0; display: none; }
        .result p { margin: 10px 0; font-size: 16px; }
        .tax-note { color: #6c757d; font-size: 14px; margin-top: -4px; margin-bottom: 15px; line-height: 1.5; }
        .highlight { font-weight: 600; color: #dc3545; }
        
        .total-taxes-box { background-color: #fff3f3; border: 1px solid #f5c2c2; padding: 18px; border-radius: 8px; margin-top: 20px; }
        .total-taxes-box p { margin: 8px 0; font-size: 16px; }

    </style>
</head>
<body>

<div id="captureArea">
    <div class="calculator-container">
        <h2>Зарплатний розрахунок</h2>
        
        <label class="main-label" for="netSalary">Бажана сума на руки (Net), грн:</label>
        <input type="number" id="netSalary" inputmode="numeric" placeholder="Наприклад: 45000">

        <div class="checkbox-group">
            <input type="checkbox" id="isDisability" checked>
            <label for="isDisability">
                Працівник має інвалідність<br>
                <small>(Знижує ставку ЄСВ з 22% до 8.41%)</small>
            </label>
        </div>

        <div class="result" id="resultBox">
            <p><strong>Нараховано (Gross):</strong> <span id="grossRes"></span> грн</p>
            <p class="tax-note">
                Утримано 23% податків з працівника: <br>
                • ПДФО (18%): <span class="highlight" id="pdfoRes"></span> грн<br>
                • ВЗ (5%): <span class="highlight" id="vzRes"></span> грн
            </p>
            
            <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 15px 0;">
            
            <p><strong>Витрати роботодавця:</strong> <span id="totalRes"></span> грн</p>
            <p class="tax-note">
                Нарахування на компанію:<br>
                • ЄСВ (<span id="esvPercent"></span>): <span class="highlight" id="esvRes"></span> грн
            </p>
            
            <div class="total-taxes-box">
                <p style="font-weight: 700; color: #b02a37; font-size: 17px;">Всього податків:</p>
                <p>• З людини: <span class="highlight" id="humanTaxes"></span> грн</p>
                <p>• З компанії: <span class="highlight" id="companyTaxes"></span> грн</p>
                <p style="font-weight: 700; margin-top: 12px; border-top: 1px dashed #f5c2c2; padding-top: 12px;">
                    Загалом: <span class="highlight" style="font-size: 18px;" id="allTaxes"></span> грн
                </p>
            </div>
        </div>

        <div id="controlsArea" style="margin-top: 25px;">
            <button id="calcBtn" class="btn-primary" onclick="calculateSalary()">Розрахувати</button>
            <button id="imgBtn" class="btn-success" onclick="saveAsImage()">📸 Зберегти картинку</button>
        </div>
    </div>
</div>

<script>
    function calculateSalary() {
        const net = parseFloat(document.getElementById('netSalary').value);
        const isDisability = document.getElementById('isDisability').checked;

        if (isNaN(net) || net <= 0) {
            alert("Введіть коректну суму.");
            return;
        }

        const gross = net / 0.77;
        const pdfo = gross * 0.18;
        const vz = gross * 0.05;
        const esvRate = isDisability ? 0.0841 : 0.22;
        const esv = gross * esvRate;
        const totalCost = gross + esv;
        
        const humanTaxesSum = pdfo + vz;
        const totalTaxesAll = humanTaxesSum + esv;

        const formatOptions = { minimumFractionDigits: 2, maximumFractionDigits: 2 };
        
        document.getElementById('grossRes').innerText = gross.toLocaleString('uk-UA', formatOptions);
        document.getElementById('pdfoRes').innerText = pdfo.toLocaleString('uk-UA', formatOptions);
        document.getElementById('vzRes').innerText = vz.toLocaleString('uk-UA', formatOptions);
        document.getElementById('esvRes').innerText = esv.toLocaleString('uk-UA', formatOptions);
        document.getElementById('totalRes').innerText = totalCost.toLocaleString('uk-UA', formatOptions);
        document.getElementById('esvPercent').innerText = isDisability ? "8.41%" : "22%";
        
        document.getElementById('humanTaxes').innerText = humanTaxesSum.toLocaleString('uk-UA', formatOptions);
        document.getElementById('companyTaxes').innerText = esv.toLocaleString('uk-UA', formatOptions);
        document.getElementById('allTaxes').innerText = totalTaxesAll.toLocaleString('uk-UA', formatOptions);
        
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('imgBtn').style.display = 'block';
    }

    function saveAsImage() {
        // 1. Отримуємо елементи
        const captureArea = document.getElementById('captureArea');
        const controls = document.getElementById('controlsArea');
        const imgBtn = document.getElementById('imgBtn');

        // 2. Тимчасово змінюємо текст кнопки для візуального відгуку
        const originalText = imgBtn.innerText;
        imgBtn.innerText = "⏳ Збереження...";
        imgBtn.disabled = true;

        // 3. Тимчасово ховаємо кнопки, щоб вони не потрапили на знімок
        controls.style.display = 'none';

        // 4. Робимо знімок
        html2canvas(captureArea, {
            scale: 2, // Збільшує якість картинки
            backgroundColor: "#f4f7f6"
        }).then(canvas => {
            // 5. Повертаємо кнопки на місце
            controls.style.display = 'block';
            imgBtn.innerText = originalText;
            imgBtn.disabled = false;

            // 6. Створюємо лінк і завантажуємо файл
            const link = document.createElement('a');
            link.download = 'Offer_Ogrant.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }).catch(err => {
            console.error("Помилка при збереженні картинки: ", err);
            controls.style.display = 'block';
            imgBtn.innerText = originalText;
            imgBtn.disabled = false;
            alert("Сталася помилка при збереженні файлу.");
        });
    }
</script>

</body>
</html>
