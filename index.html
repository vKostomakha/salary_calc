<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Ogrant Payroll</title>
    <!-- Бібліотека для створення знімка екрана -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Базові змінні для сучасного дизайну */
        :root {
            --bg-color: #eef2f7;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --success-hover: #047857;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            justify-content: center; 
        }
        
        #captureArea { 
            width: 100%; 
            max-width: 500px; 
            background-color: var(--bg-color); /* Фон для знімка */
            padding: 10px;
            box-sizing: border-box;
        }
        
        .calculator-container { 
            background: var(--card-bg); 
            padding: 30px 25px; 
            border-radius: 24px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); 
            width: 100%; 
            box-sizing: border-box; 
        }
        
        h2 { font-size: 24px; margin-top: 0; margin-bottom: 25px; color: var(--text-main); text-align: center; }
        
        /* Перемикач Штат / ФОП */
        .radio-group { display: flex; gap: 12px; margin-bottom: 25px; }
        .radio-option { flex: 1; }
        .radio-option input { display: none; }
        .radio-option label { 
            display: block; padding: 14px; text-align: center; border-radius: 14px; 
            background: #f1f5f9; cursor: pointer; font-weight: 600; transition: all 0.3s ease;
            color: var(--text-muted); border: 2px solid transparent;
        }
        .radio-option input:checked + label { 
            background: rgba(37, 99, 235, 0.1); color: var(--primary); border-color: var(--primary); 
        }
        
        /* Блок інвалідності */
        .checkbox-group { 
            display: flex; align-items: center; margin-bottom: 20px; 
            background: #fff8f8; padding: 15px; border-radius: 14px; 
            border: 1px dashed #fca5a5; transition: 0.3s;
        }
        .checkbox-group input { width: 22px; height: 22px; margin-right: 12px; cursor: pointer; }
        .checkbox-group label { font-size: 14px; cursor: pointer; font-weight: 500; margin: 0; color: #991b1b; }
        
        /* Поля вводу */
        .input-group { margin-bottom: 20px; }
        .input-group label { font-size: 14px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; display: block; }
        
        input[type="number"] { 
            width: 100%; padding: 16px; border: 2px solid var(--border-color); border-radius: 16px; 
            font-size: 18px; font-weight: 600; box-sizing: border-box; transition: all 0.3s;
            color: var(--text-main); -webkit-appearance: none;
        }
        input[type="number"]:focus { 
            border-color: var(--primary); outline: none; background-color: #f8fafc;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
        }
        
        /* Результати */
        .result { 
            margin-top: 30px; padding: 25px; background: #f8fafc; border-radius: 20px; 
            display: none; border: 1px solid var(--border-color);
            animation: slideUp 0.4s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-row { margin-bottom: 15px; font-size: 15px; }
        .result-row:last-child { margin-bottom: 0; }
        .result-label { color: var(--text-muted); display: block; margin-bottom: 4px; font-size: 14px; }
        .result-val { font-weight: 700; font-size: 16px; color: var(--text-main); }
        
        .total-taxes {
            margin-top: 15px; padding-top: 15px; border-top: 2px dashed #cbd5e1;
        }
        .total-taxes .result-val { color: var(--danger); font-size: 18px; }
        
        /* Кнопки */
        .controls { margin-top: 25px; }
        button { 
            width: 100%; padding: 18px; border: none; border-radius: 16px; 
            font-size: 17px; font-weight: 700; cursor: pointer; transition: all 0.2s;
            margin-bottom: 12px; -webkit-tap-highlight-color: transparent;
        }
        .btn-success { background: var(--success); color: white; display: none; }
        .btn-success:active { background: var(--success-hover); transform: scale(0.98); }
        .btn-reset { background: #f1f5f9; color: var(--text-muted); }
        .btn-reset:active { background: #e2e8f0; transform: scale(0.98); }

        /* Стилі спеціально для моменту генерації картинки */
        .exporting .controls { display: none !important; }
        .exporting input { border-color: transparent !important; background: transparent !important; box-shadow: none !important; padding-left: 0 !important; color: var(--primary) !important; pointer-events: none; }
    </style>
</head>
<body>

<div id="captureArea">
    <div class="calculator-container" id="mainContainer">
        <h2>Фінансовий Оффер</h2>
        
        <!-- Тип працевлаштування -->
        <div class="radio-group">
            <div class="radio-option">
                <input type="radio" id="typeStaff" name="contractType" value="staff" checked onchange="toggleDisability(); calculate('net')">
                <label for="typeStaff">Штат (КЗпП)</label>
            </div>
            <div class="radio-option">
                <input type="radio" id="typeFop" name="contractType" value="fop" onchange="toggleDisability(); calculate('net')">
                <label for="typeFop">ФОП (3 група)</label>
            </div>
        </div>

        <div class="checkbox-group" id="disabilityBlock">
            <input type="checkbox" id="isDisability" onchange="calculate('net')">
            <label for="isDisability">Працівник має інвалідність (ЄСВ 8.41%)</label>
        </div>

        <!-- Інтерактивні поля (Реверсивні) -->
        <div class="input-group">
            <label>Бажана сума на руки (Net), грн</label>
            <input type="number" id="inNet" inputmode="numeric" oninput="calculate('net')" placeholder="0">
        </div>
        
        <div class="input-group">
            <label>Нарахована зарплата (Gross), грн</label>
            <input type="number" id="inGross" inputmode="numeric" oninput="calculate('gross')" placeholder="0">
        </div>
        
        <div class="input-group">
            <label id="lblTotal">Повний бюджет компанії (Total Cost), грн</label>
            <input type="number" id="inTotal" inputmode="numeric" oninput="calculate('total')" placeholder="0">
        </div>

        <!-- Блок результатів (Анімований) -->
        <div class="result" id="resultBox">
            <div class="result-row">
                <span class="result-label" id="lblTaxesEmployee">Утримання з працівника:</span>
                <span class="result-val" id="valEmployeeTaxes">0.00 грн</span>
                <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;" id="descEmployeeTaxes"></div>
            </div>
            
            <div class="result-row">
                <span class="result-label" id="lblTaxesCompany">Нарахування на компанію:</span>
                <span class="result-val" id="valCompanyTaxes">0.00 грн</span>
                <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;" id="descCompanyTaxes"></div>
            </div>
            
            <div class="result-row total-taxes">
                <span class="result-label" style="color: var(--text-main); font-weight: 600;">Держава отримує загалом:</span>
                <span class="result-val" id="valAllTaxes">0.00 грн</span>
            </div>
        </div>

        <!-- Кнопки управління -->
        <div class="controls">
            <button id="imgBtn" class="btn-success" onclick="saveAsImage()">📸 Зберегти як картинку</button>
            <button class="btn-reset" onclick="clearAll()">Очистити дані</button>
        </div>
    </div>
</div>

<script>
    const FIXED_FOP_ESV = 1760; // Актуальний мінімальний ЄСВ
    const formatOpt = { minimumFractionDigits: 2, maximumFractionDigits: 2 };

    // Управління відображенням блоку інвалідності
    function toggleDisability() {
        const isFop = document.getElementById('typeFop').checked;
        const disBlock = document.getElementById('disabilityBlock');
        const lblTotal = document.getElementById('lblTotal');
        
        if (isFop) {
            disBlock.style.display = 'none';
            document.getElementById('isDisability').checked = false;
            lblTotal.innerText = "Акт виконаних робіт (Бюджет компанії), грн";
        } else {
            disBlock.style.display = 'flex';
            lblTotal.innerText = "Повний бюджет компанії (Total Cost), грн";
        }
    }

    // Головний реверсивний алгоритм
    function calculate(source) {
        const isFop = document.getElementById('typeFop').checked;
        const isDis = document.getElementById('isDisability').checked;
        
        let inNet = document.getElementById('inNet');
        let inGross = document.getElementById('inGross');
        let inTotal = document.getElementById('inTotal');
        
        let net = 0, gross = 0, total = 0;
        let esvRate = isDis ? 0.0841 : 0.22;

        let baseVal = 0;
        if (source === 'net') baseVal = parseFloat(inNet.value) || 0;
        if (source === 'gross') baseVal = parseFloat(inGross.value) || 0;
        if (source === 'total') baseVal = parseFloat(inTotal.value) || 0;

        if (baseVal === 0) {
            if(source !== 'net') inNet.value = "";
            if(source !== 'gross') inGross.value = "";
            if(source !== 'total') inTotal.value = "";
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('imgBtn').style.display = 'none';
            return;
        }

        // Логіка розрахунків
        if (isFop) {
            if (source === 'net') {
                net = baseVal;
                gross = (net + FIXED_FOP_ESV) / 0.95;
                total = gross;
            } else if (source === 'gross') {
                gross = baseVal;
                net = gross * 0.95 - FIXED_FOP_ESV;
                total = gross;
            } else if (source === 'total') {
                total = baseVal;
                gross = total;
                net = gross * 0.95 - FIXED_FOP_ESV;
            }
        } else {
            if (source === 'net') {
                net = baseVal;
                gross = net / 0.77;
                total = gross * (1 + esvRate);
            } else if (source === 'gross') {
                gross = baseVal;
                net = gross * 0.77;
                total = gross * (1 + esvRate);
            } else if (source === 'total') {
                total = baseVal;
                gross = total / (1 + esvRate);
                net = gross * 0.77;
            }
        }

        // Запобіжник від мінусових значень
        if (net < 0) net = 0;

        // Заповнення полів (форматування до 2 знаків, але зберігаємо числа для input)
        if (source !== 'net') inNet.value = net.toFixed(2);
        if (source !== 'gross') inGross.value = gross.toFixed(2);
        if (source !== 'total') inTotal.value = total.toFixed(2);

        renderBreakdown(isFop, esvRate, gross);
    }

    // Відображення деталізації податків
    function renderBreakdown(isFop, esvRate, gross) {
        let textEmpDesc = "", textCompDesc = "";
        let valEmp = 0, valComp = 0;

        if (isFop) {
            let ep = gross * 0.05;
            valEmp = ep + FIXED_FOP_ESV;
            valComp = 0;
            
            document.getElementById('lblTaxesEmployee').innerText = "Податки підрядника (ФОП):";
            document.getElementById('lblTaxesCompany').innerText = "Додаткові податки компанії:";
            
            textEmpDesc = `Єдиний податок 5% (${ep.toLocaleString('uk-UA', formatOpt)} грн) + ЄСВ (${FIXED_FOP_ESV.toLocaleString('uk-UA', formatOpt)} грн)`;
            textCompDesc = "Компанія сплачує виключно суму акту.";
        } else {
            let pdfo = gross * 0.18;
            let vz = gross * 0.05;
            let esv = gross * esvRate;
            
            valEmp = pdfo + vz;
            valComp = esv;
            
            document.getElementById('lblTaxesEmployee').innerText = "Утримано з працівника (23%):";
            document.getElementById('lblTaxesCompany').innerText = `Нарахування на компанію (ЄСВ ${(esvRate*100).toFixed(2).replace('.00', '')}%):`;
            
            textEmpDesc = `ПДФО 18% (${pdfo.toLocaleString('uk-UA', formatOpt)} грн) + ВЗ 5% (${vz.toLocaleString('uk-UA', formatOpt)} грн)`;
            textCompDesc = `Сплачується зверху від суми Gross.`;
        }

        document.getElementById('valEmployeeTaxes').innerText = valEmp.toLocaleString('uk-UA', formatOpt) + " грн";
        document.getElementById('descEmployeeTaxes').innerText = textEmpDesc;
        
        document.getElementById('valCompanyTaxes').innerText = valComp.toLocaleString('uk-UA', formatOpt) + " грн";
        document.getElementById('descCompanyTaxes').innerText = textCompDesc;
        
        document.getElementById('valAllTaxes').innerText = (valEmp + valComp).toLocaleString('uk-UA', formatOpt) + " грн";
        
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('imgBtn').style.display = 'block';
    }

    function clearAll() {
        document.getElementById('inNet').value = "";
        document.getElementById('inGross').value = "";
        document.getElementById('inTotal').value = "";
        document.getElementById('resultBox').style.display = 'none';
        document.getElementById('imgBtn').style.display = 'none';
    }

    function saveAsImage() {
        const mainContainer = document.getElementById('mainContainer');
        const imgBtn = document.getElementById('imgBtn');
        const originalText = imgBtn.innerText;
        
        imgBtn.innerText = "⏳ Обробка...";
        
        // Додаємо клас, який ховає кнопки та форматує інпути для красивого скриншоту
        mainContainer.classList.add('exporting');

        // Невелика затримка, щоб браузер встиг застосувати CSS класи
        setTimeout(() => {
            html2canvas(mainContainer, { 
                scale: 2, 
                backgroundColor: "#eef2f7" // Колір фону такий самий, як у body
            }).then(canvas => {
                // Відновлюємо інтерфейс
                mainContainer.classList.remove('exporting');
                imgBtn.innerText = originalText;
                
                // Створення файлу та завантаження
                const link = document.createElement('a');
                link.download = 'Ogrant_Payroll_Offer.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Помилка генерації зображення: ", err);
                mainContainer.classList.remove('exporting');
                imgBtn.innerText = originalText;
                alert("Помилка при збереженні.");
            });
        }, 150);
    }
</script>

</body>
</html>
